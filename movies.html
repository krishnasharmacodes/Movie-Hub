<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Hub</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-black via-slate-950 to-blue-950 min-h-screen text-white">

  <!-- Navbar -->
   <nav class="sticky top-0 z-50 border-b border-white/10 bg-black/40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

            <h1 class="text-2xl md:text-3xl font-bold tracking-wider">
                <span class="text-blue-500">M</span>ovie
                <span class="text-blue-500">H</span>ub
            </h1>

            <!-- Desktop Menu -->
            <ul class="hidden md:flex gap-8 font-medium">
                <li><a href="index.html" class="hover:text-blue-400 transition">Home</a></li>
                <li><a href="movies.html" class="hover:text-blue-400 transition">Movies</a></li>
                <li><a href="about.html" class="hover:text-blue-400 transition">About</a></li>
            </ul>

            <!-- Mobile Menu Button -->
            <button id="menuBtn" class="md:hidden">
                <svg class="w-8 h-8"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M4 6h16M4 12h16M4 18h16">
                    </path>
                </svg>
            </button>

        </div>

        <!-- Mobile Menu -->
        <div id="mobileMenu"
             class="hidden md:hidden bg-slate-950 border-t border-white/10">

            <ul class="flex flex-col text-center">

                <li>
                    <a href="index.html"
                       class="block py-4 hover:bg-blue-600 transition">
                        Home
                    </a>
                </li>

                <li>
                    <a href="movies.html"
                       class="block py-4 hover:bg-blue-600 transition">
                        Movies
                    </a>
                </li>

                <li>
                    <a href="about.html"
                       class="block py-4 hover:bg-blue-600 transition">
                        About
                    </a>
                </li>

            </ul>
        </div>
    </nav>

  <!-- Hero -->
  <section class="text-center py-16 px-6">

    <h2 class="text-5xl font-bold mb-4">
      Discover Amazing Movies
    </h2>

    <p class="text-slate-400 mb-8">
      Search your favourite movies instantly.
    </p>

    <form id="movieForm" class="flex justify-center gap-3 flex-wrap">

      <input
        id="movieInput"
        type="text"
        placeholder="Search Movie..."
        class="w-[450px] max-w-full px-5 py-3 rounded-xl bg-slate-900 border border-slate-700 outline-none">

      <button
        class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-xl">
        Search
      </button>

    </form>

  </section>

  <!-- Trending Movies -->
  <section id="movies" class="max-w-7xl mx-auto px-6">

    <h2 class="text-3xl font-bold mb-8">
      Movies
    </h2>

    <div
      id="movieHub"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    </div>

  </section>

      <!-- Footer -->
    <footer class="border-t border-white/10 py-8 text-center">

         <h2 class="text-2xl md:text-3xl font-bold tracking-wider">
                <span class="text-blue-500">M</span>ovie
                <span class="text-blue-500">H</span>ub
            </h2>

        <p class="text-slate-400 mb-4">
            Your gateway to discovering amazing movies.
        </p>

        <p class="text-slate-500 text-sm">
            © 2026 Movie Hub. All Rights Reserved.
        </p>

    </footer>
        <script>
        const menuBtn = document.getElementById("menuBtn");
        const mobileMenu = document.getElementById("mobileMenu");

        menuBtn.addEventListener("click", () => {
            mobileMenu.classList.toggle("hidden");
        });
    </script>

  <script src="movies.js"></script>

</body>
</html>
